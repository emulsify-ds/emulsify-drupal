name: Published Dependency Compatibility

on:
  pull_request:
  push:
    branches: [main, 7.x, release-7]
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-dependencies:
    name: ${{ matrix.package }} / Drupal ${{ matrix.core }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [drupal/emulsify, emulsify-ds/emulsify-drupal]
        core: ['^11.3', '^12']
        include:
          - core: '^11.3'
            php: '8.3'
            label: drupal-11-php-83
          - core: '^12'
            php: '8.5'
            label: drupal-12-php-85
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/composer/files
          key: published-composer-${{ runner.os }}-${{ matrix.label }}-${{ hashFiles('composer.json') }}
          restore-keys: published-composer-${{ runner.os }}-${{ matrix.label }}-

      - name: Resolve, audit and enable published theme
        env:
          CORE_CONSTRAINT: ${{ matrix.core }}
          THEME_PACKAGE: ${{ matrix.package }}
        run: bash .github/scripts/published-dependency-check.sh "$CORE_CONSTRAINT" "$THEME_PACKAGE" "$RUNNER_TEMP/published-site" "$RUNNER_TEMP/published-evidence"

      - name: Name evidence artifact
        if: ${{ !cancelled() }}
        env:
          THEME_PACKAGE: ${{ matrix.package }}
        run: echo "PACKAGE_ARTIFACT=${THEME_PACKAGE//\//-}" >> "$GITHUB_ENV"

      - name: Upload install and audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-${{ env.PACKAGE_ARTIFACT }}-${{ matrix.label }}
          path: ${{ runner.temp }}/published-evidence
          if-no-files-found: warn
