name: Semantic Release on Merge
on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: gd, imagick

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --no-check-publish --strict

      - name: Install root npm dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Audit runtime npm dependencies
        run: npm audit --omit=dev

      - name: Audit all npm dependencies (advisory)
        continue-on-error: true
        run: npm audit

      - name: Lint PHP files
        run: npm run lint:php

      - name: Run static release check
        run: npm run release:check -- --skip-smoke

      - name: Run full release check with Drupal fixture smoke coverage
        timeout-minutes: 35
        env:
          EMULSIFY_STARTERKIT_TEST: "1"
          EMULSIFY_STARTERKIT_STORYBOOK_BUILD: "1"
        run: npm run release:check

  release:
    name: Attempt Semantic Release
    runs-on: ubuntu-latest
    needs: release-readiness
    # @semantic-release/github publishes releases and comments on resolved
    # issues and pull requests with its default configuration.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
