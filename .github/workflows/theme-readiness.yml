name: Theme Readiness

on:
  pull_request:
  # Keep 7.x push coverage because this release branch owns the readiness
  # workflow before it lands on main.
  push:
    branches:
      - main
      - 7.x
      - release-7
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-readiness-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  theme-readiness:
    name: Theme Readiness (${{ matrix.label }} / PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Drupal 11.3
            artifact-suffix: drupal-11-3-php-8-3
            drupal-version: '11.3.*'
            php-version: '8.3'
            experimental: false
          - label: Drupal 11.3
            artifact-suffix: drupal-11-3-php-8-4
            drupal-version: '11.3.*'
            php-version: '8.4'
            experimental: false
          - label: Drupal 11.3
            artifact-suffix: drupal-11-3-php-8-5
            drupal-version: '11.3.*'
            php-version: '8.5'
            experimental: false
          - label: Drupal Dev Branch
            artifact-suffix: drupal-dev-main-php-8-5
            drupal-version: 'dev-main'
            php-version: '8.5'
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: gd, imagick

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --no-check-publish --strict

      - name: Install root npm dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Test validation and release guards
        run: node --test .github/scripts/*.test.cjs

      - name: Audit runtime npm dependencies
        run: npm audit --omit=dev

      - name: Audit all npm dependencies (advisory)
        continue-on-error: true
        run: npm audit

      - name: Lint PHP files
        run: npm run lint:php

      - name: Run static release check
        run: npm run release:check -- --skip-smoke

      - name: Build fixture site
        id: build_fixture
        continue-on-error: ${{ matrix.experimental }}
        run: bash .github/scripts/setup-fixture-site.sh "${{ matrix.drupal-version }}" /tmp/emulsify-fixture "$GITHUB_WORKSPACE"

      - name: Characterize published PHP Twig helpers
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        run: php .github/scripts/twig-helper-contract.php /tmp/emulsify-fixture

      - name: Characterize Drupal hooks with test-only Paragraphs
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' && matrix.drupal-version != 'dev-main' }}
        working-directory: /tmp/emulsify-fixture
        run: |
          composer require --dev --no-interaction --with-all-dependencies 'drupal/paragraphs:^1.23'
          ./vendor/bin/drush php:script "$GITHUB_WORKSPACE/.github/scripts/hook-contract-smoke.php"

      # Once the fixture exists, run each readiness slice independently. A
      # render regression should not hide favicon or Whisk starter signal on PRs.
      - name: Verify Emulsify ships the full stable9 template surface
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        run: bash .github/scripts/template-parity.sh /tmp/emulsify-fixture "$GITHUB_WORKSPACE" "$RUNNER_TEMP/emulsify-template-parity.md"

      - name: Upload stable9 parity report
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stable9-template-parity-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/emulsify-template-parity.md

      - name: Smoke test parent theme page rendering
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        run: bash .github/scripts/render-reference-pages.sh /tmp/emulsify-fixture /tmp/emulsify-base-theme

      - name: Smoke test generated favicon package
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        run: bash .github/scripts/favicon-smoke.sh /tmp/emulsify-fixture emulsify

      - name: Smoke test favicon portability and sanitizer coverage
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        run: bash .github/scripts/favicon-portability-smoke.sh /tmp/emulsify-fixture emulsify

      - name: 'Whisk starter: generate child theme'
        id: starterkit_generate
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        timeout-minutes: 2
        run: bash .github/scripts/starterkit-smoke.sh /tmp/emulsify-fixture "${{ runner.temp }}/emulsify-generated-theme" generate

      - name: 'Generated child theme: enable'
        id: starterkit_enable
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' && steps.starterkit_generate.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        timeout-minutes: 3
        run: bash .github/scripts/starterkit-smoke.sh /tmp/emulsify-fixture "${{ runner.temp }}/emulsify-generated-theme" enable

      - name: 'Generated child theme: render Drupal pages'
        id: starterkit_render
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' && steps.starterkit_enable.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        timeout-minutes: 3
        run: bash .github/scripts/starterkit-smoke.sh /tmp/emulsify-fixture "${{ runner.temp }}/emulsify-generated-theme" render

      - name: 'Generated child theme: install frontend dependencies'
        id: starterkit_frontend_install
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' && steps.starterkit_render.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        timeout-minutes: 15
        run: bash .github/scripts/starterkit-smoke.sh /tmp/emulsify-fixture "${{ runner.temp }}/emulsify-generated-theme" frontend-install

      - name: Characterize published JavaScript Twig helpers
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' && steps.starterkit_frontend_install.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        run: node .github/scripts/twig-helper-contract.cjs /tmp/emulsify-fixture/web/themes/custom/example_theme

      - name: 'Generated child theme: inspect components'
        id: starterkit_frontend_inspect
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' && steps.starterkit_frontend_install.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        timeout-minutes: 2
        run: bash .github/scripts/starterkit-smoke.sh /tmp/emulsify-fixture "${{ runner.temp }}/emulsify-generated-theme" frontend-inspect

      - name: 'Generated child theme: build frontend assets'
        id: starterkit_frontend_build
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' && steps.starterkit_frontend_inspect.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        timeout-minutes: 5
        run: bash .github/scripts/starterkit-smoke.sh /tmp/emulsify-fixture "${{ runner.temp }}/emulsify-generated-theme" frontend-build

      - name: 'Generated child theme: run frontend tests'
        id: starterkit_frontend_test
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' && steps.starterkit_frontend_inspect.outcome == 'success' }}
        continue-on-error: ${{ matrix.experimental }}
        timeout-minutes: 3
        run: bash .github/scripts/starterkit-smoke.sh /tmp/emulsify-fixture "${{ runner.temp }}/emulsify-generated-theme" frontend-test

      - name: Upload generated child theme smoke artifacts
        if: ${{ !cancelled() && steps.build_fixture.outcome == 'success' && (steps.starterkit_generate.outcome == 'failure' || steps.starterkit_enable.outcome == 'failure' || steps.starterkit_render.outcome == 'failure' || steps.starterkit_frontend_install.outcome == 'failure' || steps.starterkit_frontend_inspect.outcome == 'failure' || steps.starterkit_frontend_build.outcome == 'failure' || steps.starterkit_frontend_test.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "generated-child-theme-smoke-${{ matrix.artifact-suffix }}"
          if-no-files-found: warn
          path: "${{ runner.temp }}/emulsify-generated-theme"

  generated-child-theme-extended:
    name: Generated Child Theme Storybook and Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          tools: composer:v2
          extensions: gd, imagick

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Select and verify runner Chrome
        timeout-minutes: 1
        run: |
          # Ubuntu's AppArmor profile permits the installed Google Chrome.
          # Verify it launches with its sandbox before either Puppeteer audit.
          chrome_path="$(command -v google-chrome)"
          "$chrome_path" --version
          "$chrome_path" --headless --dump-dom about:blank
          printf 'PUPPETEER_EXECUTABLE_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-emulsify-consumer-${{ hashFiles('composer.json', 'whisk/package.json', 'whisk/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-emulsify-consumer-

      - name: Install root npm dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Test validation and release guards
        run: node --test .github/scripts/*.test.cjs

      - name: Build fixture site
        run: bash .github/scripts/setup-fixture-site.sh "11.4.6" /tmp/emulsify-fixture "$GITHUB_WORKSPACE"

      - name: Run generated child theme Storybook, test, and accessibility checks
        timeout-minutes: 30
        env:
          EMULSIFY_STARTERKIT_TEST: "1"
          EMULSIFY_STARTERKIT_A11Y: "1"
        run: bash .github/scripts/starterkit-smoke.sh /tmp/emulsify-fixture "${{ runner.temp }}/emulsify-generated-theme-extended"

      - name: Upload generated child theme extended artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-child-theme-storybook-a11y
          if-no-files-found: warn
          path: "${{ runner.temp }}/emulsify-generated-theme-extended"
